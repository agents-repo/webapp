# SonarQube Cloud automatic analysis (see https://docs.sonarsource.com/sonarqube-cloud).
sonar.sourceEncoding=UTF-8

# Directory names only for sonar.sources and sonar.tests: Automatic Analysis does
# not allow wildcard paths there. Do not set sonar.sources to `.` while
# sonar.tests lists nested directories — analysis fails with path overlap.
sonar.sources=src,public,scripts,docs

# Binary and generated assets are not UTF-8 text; exclude them to avoid encoding warnings.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.ico,**/*.webp,**/*.woff,**/*.woff2

# Playwright specs (`e2e/`) and repo tooling tests (`test/`) are test code, not
# production sources. Co-located Vitest files under `src/` stay source. This
# does not include `src/test/` (shared Vitest helpers).
sonar.tests=e2e,test
