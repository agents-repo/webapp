name: PR Baseline Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  changes:
    name: Path filters
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      slides: ${{ steps.match.outputs.slides }}
      og: ${{ steps.match.outputs.og }}
      agents: ${{ steps.match.outputs.agents }}
      pages: ${{ steps.match.outputs.pages }}
      cliDocs: ${{ steps.match.outputs.cliDocs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Match changed paths
        id: match
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/ci-pr-path-filters.mjs

  baseline:
    name: baseline
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node and pinned npm
        uses: ./.github/actions/setup-node-pinned-npm

      - name: Validate runtime
        run: npm run env:check

      - name: Run Markdown and code lint
        run: npm run lint:all

      - name: Check IDE instruction mirrors
        run: npm run sync:ide-instructions -- --check

      - name: Setup Chrome for Marp PDF
        if: needs.changes.outputs.slides == 'true'
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: setup-chrome

      - name: Check slide PDF drift
        if: needs.changes.outputs.slides == 'true'
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROME_NO_SANDBOX: '1'
        run: npm run slides:check

      - name: Skip slide PDF check
        if: needs.changes.outputs.slides != 'true'
        run: echo "Skipping slides:check; PR paths do not match the slides group (docs/slides/**, scripts/slides.mjs, npm lockfiles, pr-baseline.yml, or scripts/ci-pr-path-filters.mjs)."

      - name: Check committed OG JPEG drift
        if: needs.changes.outputs.og == 'true'
        run: npm run og:check

      - name: Skip OG JPEG check
        if: needs.changes.outputs.og != 'true'
        run: echo "Skipping og:check; PR paths do not match the og group (scripts/og/**, scripts/og-image.mjs, src/assets/logo/agents-repo-logo.svg, public/og-image.jpg, public/og-image.src.sha256, public/og/**, npm lockfiles, pr-baseline.yml, or scripts/ci-pr-path-filters.mjs)."

      - name: Verify agents lock and committed extracts
        if: needs.changes.outputs.agents == 'true'
        run: |
          npm run agents:verify
          drift_paths=(
            agents.json
            agents-lock.json
            .github/agents
            .cursor/skills
            .claude/agents
            .agents/skills
          )
          git diff --exit-code -- "${drift_paths[@]}"
          test -z "$(git status --porcelain -- "${drift_paths[@]}")"

      - name: Skip registry package verify
        if: needs.changes.outputs.agents != 'true'
        run: echo "Skipping agents:verify; PR paths do not match agents definition files (agents.json, agents-lock.json, extracted agent paths, pr-baseline.yml, or scripts/ci-pr-path-filters.mjs). npm lockfiles alone do not trigger this step."

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Build for Pages
        if: needs.changes.outputs.pages == 'true'
        run: npm run build:pages

      - name: Verify crawl files
        if: needs.changes.outputs.pages == 'true'
        run: npm run test:crawl-files

      - name: Skip Pages and crawl extras
        if: needs.changes.outputs.pages != 'true'
        run: echo "Skipping build:pages and test:crawl-files; PR paths do not match the pages group (src/**, public/**, scripts/** except slides.mjs, Vite/tsconfig, npm lockfiles, crawl tests, or pr-baseline.yml). eslint.config.js-only changes do not trigger this extra."

      - name: Checkout CLI for docs sync
        if: needs.changes.outputs.cliDocs == 'true'
        uses: actions/checkout@v6
        with:
          repository: agents-repo/cli
          path: .ci-cli
          ref: main

      - name: Sync CLI command inventory
        if: needs.changes.outputs.cliDocs == 'true'
        env:
          AGENTS_REPO_WEBAPP_ROOT: ${{ github.workspace }}
        working-directory: ${{ github.workspace }}/.ci-cli
        run: |
          if [ ! -f scripts/check-docs-sync.mjs ]; then
            echo "Skipping check:docs-sync; agents-repo/cli main does not have scripts/check-docs-sync.mjs yet."
            exit 0
          fi
          npm ci
          npm run check:docs-sync

      - name: Skip CLI docs sync
        if: needs.changes.outputs.cliDocs != 'true'
        run: echo "Skipping check:docs-sync; PR paths do not match cli-commands.md locales, pr-baseline.yml, or scripts/ci-pr-path-filters.mjs."
